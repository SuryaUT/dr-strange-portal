[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0

; Same firmware, but also prints live sensor readings to the serial monitor at
; 10 Hz. Use this for the first bring-up test, before trusting Bluetooth.
[env:xiao_serial_test]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -DSERIAL_IMU
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DUNIT_TEST
