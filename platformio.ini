; Two rings, two boards, one repo. Each env compiles only its own folder under
; src/, so the firmwares never see each other's code. lib/ is shared by both.
;
;   portal_ring   the ring with the IMU: circle gesture -> BLE
;   touch_ring    the key ring: capacitive touch -> serial

[env:portal_ring]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<portal_ring/>
build_flags = -std=gnu++17
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0

; Same firmware, but also prints live sensor readings to the serial monitor at
; 10 Hz. Use this for the first bring-up test, before trusting Bluetooth.
[env:portal_ring_serial]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<portal_ring/>
build_flags = -std=gnu++17 -DSERIAL_IMU
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0

; The key ring. No IMU - just the touch latch, broadcast as one byte.
[env:touch_ring]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<touch_ring/>
build_flags = -std=gnu++17
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DUNIT_TEST
